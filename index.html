<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADM MoMo Payment</title>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: radial-gradient(ellipse at center, #2a2a2a, #0d0d0d);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 35px 30px;
            max-width: 520px;
            width: 100%;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                0 0 80px rgba(255, 255, 255, 0.02);
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo .icon {
            font-size: 32px;
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #e0e0e0, #a0a0a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo h1 span {
            background: linear-gradient(135deg, #d4d4d4, #888888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .header-actions button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.4);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .header-actions button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 255, 255, 0.1);
        }

        /* ===== PAYMENT FORM ===== */
        .form-section {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .form-section .section-title {
            color: rgba(255, 255, 255, 0.25);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 5px;
            letter-spacing: 0.3px;
        }

        .phone-input {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .phone-input:focus-within {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.03);
        }

        .phone-input .country-code {
            padding: 12px 0 12px 14px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
        }

        .phone-input input {
            width: 100%;
            padding: 12px 14px 12px 8px;
            border: none !important;
            background: transparent !important;
            font-size: 15px;
            color: #e0e0e0;
            outline: none;
            box-shadow: none !important;
        }

        .phone-input input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }

        .amount-display {
            position: relative;
        }

        .amount-display .currency {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.2);
            font-weight: 600;
            font-size: 16px;
        }

        .amount-display input {
            width: 100%;
            padding: 12px 14px 12px 36px;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            font-size: 15px;
            color: #e0e0e0;
            transition: all 0.3s ease;
            outline: none;
        }

        .amount-display input:focus {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.03);
        }

        .amount-display input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }

        .pay-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4a4a4a, #1a1a1a);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #d4d4d4;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            margin-top: 4px;
        }

        .pay-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #5a5a5a, #2a2a2a);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .pay-btn:active {
            transform: scale(0.97);
        }

        /* ===== COLLAPSIBLE HISTORY ===== */
        .history-section {
            margin-top: 20px;
        }

        .history-toggle {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 0.3px;
        }

        .history-toggle:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.6);
        }

        .history-toggle .arrow {
            transition: transform 0.3s ease;
            font-size: 16px;
        }

        .history-toggle .arrow.open {
            transform: rotate(180deg);
        }

        .history-toggle .badge {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.3);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .history-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-top: 0;
        }

        .history-content.open {
            max-height: 600px;
            opacity: 1;
            margin-top: 12px;
        }

        .history-list {
            max-height: 400px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.06) transparent;
            padding-right: 4px;
        }

        .history-list::-webkit-scrollbar {
            width: 4px;
        }

        .history-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
        }

        .transaction-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .transaction-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.06);
        }

        .transaction-item .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .transaction-item .left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .transaction-item .status-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .transaction-item .status-icon.success {
            background: rgba(34, 197, 94, 0.1);
        }

        .transaction-item .status-icon.failed {
            background: rgba(239, 68, 68, 0.1);
        }

        .transaction-item .status-icon.pending {
            background: rgba(255, 255, 255, 0.05);
        }

        .transaction-item .info .phone {
            color: #e0e0e0;
            font-size: 14px;
            font-weight: 500;
        }

        .transaction-item .info .ref {
            color: rgba(255, 255, 255, 0.2);
            font-size: 10px;
            font-family: monospace;
        }

        .transaction-item .right {
            text-align: right;
        }

        .transaction-item .right .amount {
            color: #d4d4d4;
            font-size: 15px;
            font-weight: 700;
        }

        .transaction-item .right .date {
            color: rgba(255, 255, 255, 0.15);
            font-size: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 25px 10px;
            color: rgba(255, 255, 255, 0.1);
        }

        .empty-state .emoji {
            font-size: 30px;
            display: block;
            margin-bottom: 6px;
        }

        .empty-state p {
            font-size: 12px;
        }

        /* ===== RECEIPT MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 35px 30px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .modal .receipt-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .modal .receipt-header .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 6px;
        }

        .modal .receipt-header h2 {
            color: #e0e0e0;
            font-size: 20px;
            font-weight: 700;
        }

        .modal .receipt-header .sub {
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            margin-top: 2px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .modal .receipt-divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.04), transparent);
            margin: 16px 0;
        }

        .modal .receipt-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        .modal .receipt-row .label {
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
        }

        .modal .receipt-row .value {
            color: #d4d4d4;
            font-weight: 500;
        }

        .modal .receipt-row .value.amount {
            color: #d4d4d4;
            font-size: 20px;
            font-weight: 700;
        }

        .modal .receipt-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal .receipt-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal .receipt-actions .close-btn {
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .modal .receipt-actions .close-btn:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .modal .receipt-actions .print-btn {
            background: linear-gradient(135deg, #4a4a4a, #1a1a1a);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #d4d4d4;
        }

        .modal .receipt-actions .print-btn:hover {
            background: linear-gradient(135deg, #5a5a5a, #2a2a2a);
            border-color: rgba(255, 255, 255, 0.1);
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.06);
        }

        .footer span {
            color: rgba(255, 255, 255, 0.15);
            font-weight: 500;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .container {
                padding: 20px 15px;
            }
            .logo h1 {
                font-size: 20px;
            }
            .header-actions button {
                font-size: 10px;
                padding: 6px 10px;
            }
            .modal {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="logo">
                <span class="icon">💳</span>
                <h1>ADM <span>MoMo</span></h1>
            </div>
            <div class="header-actions">
                <button onclick="clearHistory()">🗑️ Clear</button>
            </div>
        </div>

        <!-- ===== PAYMENT FORM ===== -->
        <div class="form-section">
            <div class="section-title">📝 New Payment</div>

            <div class="form-group">
                <label>📱 Phone Number</label>
                <div class="phone-input">
                    <span class="country-code">+233</span>
                    <input type="tel" id="phone" placeholder="50 123 4567" value="501234567">
                </div>
            </div>

            <div class="form-group">
                <label>💰 Amount (GHS)</label>
                <div class="amount-display">
                    <span class="currency">₵</span>
                    <input type="number" id="amount" placeholder="0.00" value="100.00" step="0.01">
                </div>
            </div>

            <button class="pay-btn" onclick="initiatePayment()">
                💳 Pay Now
            </button>
        </div>

        <!-- ===== COLLAPSIBLE HISTORY ===== -->
        <div class="history-section">
            <button class="history-toggle" onclick="toggleHistory()">
                <span>📋 Transaction History <span class="badge" id="txnBadge">0</span></span>
                <span class="arrow" id="arrowIcon">▼</span>
            </button>
            <div class="history-content" id="historyContent">
                <div class="history-list" id="historyList">
                    <!-- Dynamically populated -->
                </div>
            </div>
        </div>

        <div class="footer">
            🔒 Secured by <span>Paystack</span> • ADM MoMo v2.0
        </div>
    </div>

    <!-- ===== RECEIPT MODAL ===== -->
    <div class="modal-overlay" id="receiptModal">
        <div class="modal">
            <div class="receipt-header">
                <span class="icon">🧾</span>
                <h2>Payment Receipt</h2>
                <p class="sub">ADM MoMo Payment</p>
            </div>

            <div class="receipt-divider"></div>

            <div class="receipt-row">
                <span class="label">Status</span>
                <span class="value" id="receiptStatus" style="color:#4ade80;">✅ Successful</span>
            </div>
            <div class="receipt-row">
                <span class="label">Amount</span>
                <span class="value amount" id="receiptAmount">₵ 100.00</span>
            </div>
            <div class="receipt-row">
                <span class="label">Phone</span>
                <span class="value" id="receiptPhone">+233 50 123 4567</span>
            </div>
            <div class="receipt-row">
                <span class="label">Reference</span>
                <span class="value" id="receiptRef" style="font-family:monospace;font-size:12px;">TXN-123456</span>
            </div>
            <div class="receipt-row">
                <span class="label">Date & Time</span>
                <span class="value" id="receiptDate" style="font-size:12px;">2026-08-07 14:30</span>
            </div>

            <div class="receipt-divider"></div>

            <div class="receipt-actions">
                <button class="close-btn" onclick="closeReceipt()">Close</button>
                <button class="print-btn" onclick="printReceipt()">🖨️ Print</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURATION - 👇 REPLACE WITH YOUR PUBLIC KEY
        // ============================================
        const PAYSTACK_PUBLIC_KEY = pk_live_beaf994cee5d20a1c612a1571b22fa8df74e8536

        // ============================================
        // STATE
        // ============================================
        let transactions = [];
        let currentReceiptIndex = -1;
        let isHistoryOpen = false;

        // ============================================
        // INIT - Load from localStorage
        // ============================================
        function loadTransactions() {
            const saved = localStorage.getItem('adm_momo_transactions');
            if (saved) {
                try {
                    transactions = JSON.parse(saved);
                } catch {
                    transactions = [];
                }
            }
            renderHistory();
            updateBadge();
        }

        function saveTransactions() {
            localStorage.setItem('adm_momo_transactions', JSON.stringify(transactions));
            renderHistory();
            updateBadge();
        }

        function updateBadge() {
            document.getElementById('txnBadge').textContent = transactions.length;
        }

        // ============================================
        // TOGGLE HISTORY
        // ============================================
        function toggleHistory() {
            isHistoryOpen = !isHistoryOpen;
            const content = document.getElementById('historyContent');
            const arrow = document.getElementById('arrowIcon');

            if (isHistoryOpen) {
                content.classList.add('open');
                arrow.classList.add('open');
            } else {
                content.classList.remove('open');
                arrow.classList.remove('open');
            }
        }

        // ============================================
        // RENDER HISTORY
        // ============================================
        function renderHistory() {
            const list = document.getElementById('historyList');

            if (transactions.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <span class="emoji">📭</span>
                        <p>No transactions yet</p>
                    </div>
                `;
                return;
            }

            const sorted = [...transactions].reverse();

            list.innerHTML = sorted.map((txn, index) => {
                const realIndex = transactions.length - 1 - index;
                const statusClass = txn.status === 'success' ? 'success' : txn.status === 'failed' ? 'failed' : 'pending';
                const statusEmoji = txn.status === 'success' ? '✅' : txn.status === 'failed' ? '❌' : '⏳';
                const amount = parseFloat(txn.amount).toFixed(2);
                const date = new Date(txn.timestamp).toLocaleDateString();
                const time = new Date(txn.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                return `
                    <div class="transaction-item" onclick="viewReceipt(${realIndex})">
                        <div class="row">
                            <div class="left">
                                <div class="status-icon ${statusClass}">${statusEmoji}</div>
                                <div class="info">
                                    <div class="phone">${txn.phone}</div>
                                    <div class="ref">${txn.reference || 'N/A'}</div>
                                </div>
                            </div>
                            <div class="right">
                                <div class="amount">₵ ${amount}</div>
                                <div class="date">${date} ${time}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ============================================
        // INITIATE PAYMENT
        // ============================================
        function initiatePayment() {
            const phoneInput = document.getElementById('phone');
            const amountInput = document.getElementById('amount');

            let phone = phoneInput.value.replace(/\s/g, '');
            const amount = parseFloat(amountInput.value);

            if (!phone || phone.length < 7) {
                alert('❌ Please enter a valid phone number.');
                phoneInput.focus();
                return;
            }

            if (!amount || amount <= 0) {
                alert('❌ Please enter a valid amount.');
                amountInput.focus();
                return;
            }

            if (!phone.startsWith('+')) {
                phone = '+233' + phone.replace(/^0/, '');
            }

            const pendingTxn = {
                phone: phone,
                amount: amount,
                status: 'pending',
                reference: 'TXN-' + Date.now().toString().slice(-8),
                timestamp: Date.now()
            };

            transactions.push(pendingTxn);
            saveTransactions();

            if (!isHistoryOpen) {
                toggleHistory();
            }

            const index = transactions.length - 1;
            viewReceipt(index);

            const handler = PaystackPop.setup({
                key: PAYSTACK_PUBLIC_KEY,
                email: 'customer@adm-pay.com',
                amount: Math.round(amount * 100),
                currency: 'GHS',
                phone: phone,
                callback: function(response) {
                    transactions[index].status = 'success';
                    transactions[index].reference = response.reference;
                    transactions[index].timestamp = Date.now();
                    saveTransactions();
                    viewReceipt(index);
                    document.getElementById('amount').value = '';
                },
                onClose: function() {
                    if (transactions[index] && transactions[index].status === 'pending') {
                        transactions[index].status = 'failed';
                        saveTransactions();
                        viewReceipt(index);
                    }
                }
            });
            handler.openIframe();
        }

        // ============================================
        // RECEIPT VIEW
        // ============================================
        function viewReceipt(index) {
            const txn = transactions[index];
            if (!txn) return;

            currentReceiptIndex = index;

            const statusMap = {
                'success': '✅ Successful',
                'failed': '❌ Failed',
                'pending': '⏳ Pending'
            };

            const statusColor = {
                'success': '#4ade80',
                'failed': '#f87171',
                'pending': '#d4d4d4'
            };

            document.getElementById('receiptStatus').textContent = statusMap[txn.status] || txn.status;
            document.getElementById('receiptStatus').style.color = statusColor[txn.status] || '#ffffff';
            document.getElementById('receiptAmount').textContent = '₵ ' + parseFloat(txn.amount).toFixed(2);
            document.getElementById('receiptPhone').textContent = txn.phone;
            document.getElementById('receiptRef').textContent = txn.reference || 'N/A';

            const date = new Date(txn.timestamp);
            document.getElementById('receiptDate').textContent =
                date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            document.getElementById('receiptModal').classList.add('active');
        }

        function closeReceipt() {
            document.getElementById('receiptModal').classList.remove('active');
        }

        function printReceipt() {
            const modalContent = document.querySelector('.modal');
            const original = document.body.innerHTML;
            const printHTML = modalContent.outerHTML;

            document.body.innerHTML = `
                <style>
                    body { background: white; padding: 40px; font-family: -apple-system, sans-serif; }
                    .modal { max-width: 400px; margin: 0 auto; }
                    .receipt-header { text-align: center; }
                    .receipt-row { display: flex; justify-content: space-between; padding: 6px 0; }
                    .receipt-actions { display: none; }
                    .receipt-divider { border-top: 1px dashed #ddd; margin: 12px 0; }
                </style>
                ${printHTML}
            `;

            window.print();
            document.body.innerHTML = original;
            loadTransactions();
            if (currentReceiptIndex >= 0) {
                viewReceipt(currentReceiptIndex);
            }
            location.reload();
        }

        // ============================================
        // CLEAR HISTORY
        // ============================================
        function clearHistory() {
            if (transactions.length === 0) return;
            if (confirm('🗑️ Delete all transaction history?')) {
                transactions = [];
                saveTransactions();
                if (isHistoryOpen) {
                    toggleHistory();
                }
            }
        }

        // ============================================
        // CLOSE MODAL ON OVERLAY CLICK
        // ============================================
        document.getElementById('receiptModal').addEventListener('click', function(e) {
            if (e.target === this) closeReceipt();
        });

        // ============================================
        // KEYBOARD SHORTCUT: Enter to pay
        // ============================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const active = document.activeElement;
                if (active && (active.id === 'phone' || active.id === 'amount')) {
                    initiatePayment();
                }
            }
        });

        // ============================================
        // START
        // ============================================
        loadTransactions();
        document.getElementById('phone').focus();
    </script>

</body>
</html>
